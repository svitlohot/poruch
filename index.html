<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поруч — відкрити у Viber</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f4f7;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 32px 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    max-width: 360px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #666; font-size: 14px; margin: 0 0 24px; }
  a.btn {
    display: inline-block;
    background: #7360f2;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 16px;
  }
  .hint { margin-top: 16px; font-size: 12px; color: #999; }
</style>
</head>
<body>
  <div class="card">
    <h1>Бот "Поруч" у Viber</h1>
    <p>Натисніть кнопку нижче, щоб відкрити чат із ботом у застосунку Viber.</p>
    <!-- ВАЖЛИВО: chatURI саме з великими URI -->
    <a class="btn" href="viber://pa?chatURI=poruch_ua_bot">Відкрити у Viber</a>
    <div class="hint">Якщо кнопка не спрацювала — переконайтесь, що Viber встановлено, і що сторінку відкрито у зовнішньому браузері (не у вбудованому переглядачі Telegram).</div>
  </div>
</body>
</html>
